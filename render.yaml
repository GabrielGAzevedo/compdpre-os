# Configuração do Render (Blueprint).
# No painel do Render: New > Blueprint > escolha este repositório.
# Os valores marcados com "sync: false" são pedidos na hora de criar.
services:
  - type: web
    name: precocerto
    runtime: python
    plan: free
    region: ohio            # mesma região do banco no Supabase (us-east-2)
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL     # string do Supabase (Connect > Session pooler)
        sync: false
      - key: ML_ACCESS_TOKEN  # opcional (API do Mercado Livre)
        sync: false
